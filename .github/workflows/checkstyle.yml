name: Checkstyle violation gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - 'checkstyle/**'
      - '.github/workflows/checkstyle.yml'
      - '.github/scripts/checkstyle_report.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkstyle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Checkstyle (collect violations)
        run: mvn -B -ntp -Pcheckstyle-trial validate
      - name: Evaluate repository-wide Checkstyle threshold
        if: success()
        env:
          CHECKSTYLE_MAX_VIOLATIONS: '0'
        run: python3 .github/scripts/checkstyle_report.py --max-violations "$CHECKSTYLE_MAX_VIOLATIONS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Render Checkstyle summary if Maven failed
        if: failure()
        run: python3 .github/scripts/checkstyle_report.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Checkstyle XML reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checkstyle-reports
          path: |
            **/target/checkstyle-main.xml
            **/target/checkstyle-test.xml
          if-no-files-found: ignore
