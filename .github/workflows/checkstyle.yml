name: Checkstyle complexity report

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - 'checkstyle/**'
      - '.github/workflows/checkstyle.yml'
      - '.github/scripts/checkstyle_report.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkstyle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Checkstyle (non-blocking violations)
        run: mvn -B -ntp -Pcheckstyle-trial validate
      - name: Render Checkstyle summary
        if: always()
        run: python3 .github/scripts/checkstyle_report.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Checkstyle XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: |
            **/target/checkstyle-main.xml
            **/target/checkstyle-test.xml
          if-no-files-found: ignore
